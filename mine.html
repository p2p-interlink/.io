<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth | Mine $ITLG</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-20 font-sans">

    <!-- Top Navigation Header -->
    <div class="p-4 bg-gray-900 border-b border-gray-800 flex justify-between items-center">
        <span class="text-xl font-bold text-yellow-500">Smooth App</span>
        <a href="validate.html" class="bg-yellow-500 text-gray-950 text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-yellow-400">
            Connect Wallet
        </a>
    </div>

    <!-- Main Mining Dashboard -->
    <div class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Balance Card -->
        <div class="bg-gradient-to-r from-gray-900 to-gray-800 border border-gray-800 rounded-2xl p-6 text-center shadow-xl">
            <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Mined Balance</p>
            <h2 class="text-4xl font-extrabold text-yellow-400 mb-2" id="minedBalance">0.0000 ITLG</h2>
            <p class="text-xs text-emerald-400 font-medium">● Network: Binance Smart Chain (BEP20)</p>
        </div>

        <!-- Mining Action Button -->
        <div class="text-center">
            <button id="mineBtn" onclick="startMining()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-black py-4 rounded-xl text-lg shadow-lg transition active:scale-95">
                Start Mining $ITLG ↗
            </button>
        </div>

        <!-- Tab Controls -->
        <div class="grid grid-cols-2 gap-2 bg-gray-900 p-1 rounded-xl border border-gray-800">
            <a href="index.html" class="text-center py-2 text-sm text-gray-400 hover:text-white">Home Page</a>
            <a href="validate.html" class="text-center py-2 text-sm text-gray-400 hover:text-white">Validate Wallet</a>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 py-3 flex justify-around text-xl">
        <a href="index.html" class="hover:opacity-100 opacity-60">🏠</a>
        <a href="mine.html" class="opacity-100 border-b-2 border-yellow-500 pb-1">⛏️</a>
        <a href="validate.html" class="hover:opacity-100 opacity-60">🏪</a>
        <a href="validate.html" class="hover:opacity-100 opacity-60">⚙️</a>
    </nav>

    <script>
        let count = 0.0000;
        let mining = false;
        function startMining() {
            if(!mining) {
                mining = true;
                document.getElementById('mineBtn').innerText = "Mining Active...";
                document.getElementById('mineBtn').classList.replace("bg-yellow-500", "bg-emerald-500");
                setInterval(() => {
                    count += 0.0005;
                    document.getElementById('minedBalance').innerText = count.toFixed(4) + " ITLG";
                }, 1000);
            }
        }
    </script>
</body>
</html>
