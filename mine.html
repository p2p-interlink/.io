<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterLink | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .purple-bg { background-color: #6C5CE7; }
        .gold-btn { background: linear-gradient(135deg, #FFE17D 0%, #E2B23B 100%); }
    </style>
</head>
<body class="bg-slate-50 text-gray-900 font-sans min-h-screen pb-24">

    <!-- Header with Active App vs Wallet Toggle -->
    <header class="p-4 bg-white flex justify-between items-center shadow-sm sticky top-0 z-30">
        <div class="w-8 h-8 purple-bg rounded-xl flex items-center justify-center text-white font-bold">i</div>
        
        <!-- Toggle Pill: Clicking 'Wallet' directs to validate.html (4th Screen) -->
        <div class="bg-gray-100 p-1 rounded-full flex items-center w-48 justify-between text-xs font-semibold">
            <button class="bg-white text-gray-900 shadow-sm rounded-full py-1.5 px-6 w-1/2">App</button>
            <a href="validate.html" class="text-gray-500 text-center w-1/2 py-1.5 hover:text-gray-900 transition">Wallet</a>
        </div>

        <div class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 text-sm">👤</div>
    </header>

    <!-- Main App Display (Visually complete, static view for random user) -->
    <main class="p-4 space-y-4 max-w-md mx-auto">
        <h1 class="text-2xl font-extrabold text-gray-900 pt-2">Good Morning!</h1>

        <!-- TikTok Banner -->
        <div class="bg-white border border-gray-100 rounded-3xl p-5 shadow-sm flex justify-between items-center relative overflow-hidden">
            <div class="space-y-1 z-10">
                <h3 class="font-bold text-sm text-gray-900">Follow TikTok for InterLink updates</h3>
                <p class="text-xs text-gray-400">Get information about latest features.</p>
                <div class="pt-2">
                    <button class="bg-black text-white text-xs font-bold px-4 py-2 rounded-full">Follow now</button>
                </div>
            </div>
            <div class="w-16 h-16 bg-gray-900 rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-md">
                🎵
            </div>
        </div>

        <!-- 2-Column Stats Grid -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white border border-gray-100 rounded-3xl p-4 shadow-sm relative min-h-[120px] flex flex-col justify-between">
                <div>
                    <h2 class="text-2xl font-extrabold text-gray-900">20</h2>
                    <p class="text-xs text-gray-400 font-medium">$ITLG</p>
                </div>
                <div class="absolute right-2 bottom-2 w-12 h-12 opacity-80">
                    🪙
                </div>
            </div>

            <div class="bg-gradient-to-br from-indigo-50 to-purple-50 border border-purple-100 rounded-3xl p-4 shadow-sm relative min-h-[120px] flex flex-col justify-between">
                <div>
                    <h2 class="text-2xl font-extrabold text-gray-900">0</h2>
                    <p class="text-xs text-gray-400 font-medium">$ITLG Recoverable</p>
                </div>
                <div class="absolute right-2 bottom-2 text-3xl">
                    🟡
                </div>
            </div>
        </div>

        <!-- Mining Card -->
        <div class="bg-white border border-gray-100 rounded-3xl p-5 shadow-sm space-y-4 relative overflow-hidden">
            <div class="max-w-[200px]">
                <h3 class="font-extrabold text-base leading-snug text-gray-900">Mine $ITLG to Secure the Human Network!</h3>
            </div>
            
            <div class="absolute right-3 top-4 w-24 h-24 rounded-full bg-blue-900/10 flex items-center justify-center">
                🌐
            </div>

            <!-- Clicking Mine routes to Wallet view or shows active feedback -->
            <div>
                <a href="validate.html" class="gold-btn w-full text-gray-950 font-bold py-3.5 px-6 rounded-full text-sm shadow-md flex items-center justify-between">
                    <span>Mine $ITLG</span>
                    <span>↗</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-4 left-4 right-4 bg-white/90 backdrop-blur-md border border-gray-200/80 rounded-full py-3 px-6 flex justify-between items-center shadow-lg max-w-md mx-auto z-40">
        <a href="index.html" class="text-gray-400 hover:text-purple-600 text-xl">🌐</a>
        <a href="mine.html" class="bg-gray-950 text-white p-2.5 rounded-full text-lg">🏠</a>
        <a href="validate.html" class="text-gray-400 hover:text-purple-600 text-xl">🏪</a>
        <a href="validate.html" class="text-gray-400 hover:text-purple-600 text-xl">⚙️</a>
    </nav>
</body>
</html>
