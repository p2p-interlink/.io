<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InterLink Dashboard</title>
<style>
:root {
  --bg: #f8f9fe;
  --card-bg: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --purple: #6366f1;
  --purple-light: #f3f0ff;
  --line: #e2e8f0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
.wrap{padding:16px;max-width:500px;margin:auto}
.top-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.tab-switch{background:#eaeef8;padding:4px;border-radius:999px;display:flex;gap:4px}
.tab-btn{padding:8px 24px;border-radius:999px;border:0;font-weight:700;font-size:14px;cursor:pointer;background:transparent;color:var(--muted)}
.tab-btn.active{background:#fff;color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.icon-btn{width:38px;height:38px;border-radius:50%;background:#eee;border:0;display:grid;place-items:center;font-weight:bold;cursor:pointer}
.greeting{font-size:28px;font-weight:800;margin:0 0 16px;letter-spacing:-.02em}
.card{background:var(--card-bg);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.03);border:1px solid var(--line)}
.banner{display:flex;justify-content:space-between;align-items:center}
.banner h4{margin:0 0 4px;font-size:15px}
.banner p{margin:0;font-size:13px;color:var(--muted)}
.btn-dark{background:#000;color:#fff;border:0;padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;margin-top:12px;cursor:pointer}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:var(--card-bg);border-radius:20px;padding:18px;border:1px solid var(--line)}
.stat-num{font-size:24px;font-weight:800;margin-bottom:4px}
.stat-label{font-size:12px;color:var(--muted);font-weight:600}
.mine-card{background:var(--card-bg);border-radius:24px;padding:20px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.btn-gold{background:linear-gradient(135deg,#facc15,#eab308);color:#000;border:0;padding:12px 24px;border-radius:999px;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px 0}
.nav-item{color:var(--muted);font-size:20px;cursor:pointer;text-decoration:none}
.nav-item.active{color:var(--text);font-weight:bold}
</style>
</head>
<body>

<div class="wrap">
  <div class="top-nav">
    <div style="width:32px;height:32px;background:var(--purple);border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900">i</div>
    <div class="tab-switch">
      <button class="tab-btn active">App</button>
      <button class="tab-btn" onclick="window.location.href='validate.html'">Wallet</button>
    </div>
    <button class="icon-btn">👤</button>
  </div>

  <h1 class="greeting">Good Morning!</h1>

  <div class="card banner">
    <div>
      <h4>Follow TikTok for InterLink updates</h4>
      <p>Get information about latest features.</p>
      <button class="btn-dark">Follow now</button>
    </div>
    <div style="font-size:36px">🎵</div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num">20</div>
      <div class="stat-label">$ITLG</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">0</div>
      <div class="stat-label">$ITLG Recoverable</div>
    </div>
  </div>

  <div class="mine-card">
    <div>
      <h3 style="margin:0 0 12px;font-size:18px;max-width:180px">Mine $ITLG to Secure the Human Network!</h3>
      <button class="btn-gold" onclick="window.location.href='validate.html'">Mine $ITLG ↗</button>
    </div>
    <div style="font-size:42px">🌐</div>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html">🌐</a>
  <a class="nav-item active" href="mine.html">🏠</a>
  <a class="nav-item" href="validate.html">🏪</a>
  <a class="nav-item" href="validate.html">⚙️</a>
</nav>

</body>
</html>
